<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio & Photo Waveform Visualizer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #090d16;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      gap: 16px;
    }

    /* Visualizer Card Container */
    .visualizer-card {
      position: relative;
      width: 100%;
      max-width: 380px;
      height: 380px;
      border-radius: 20px;
      overflow: hidden;
      background-color: #1e293b;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Composite Record Canvas (Blends Image + Waveform) */
    #mainCanvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .placeholder-text {
      position: absolute;
      color: #94a3b8;
      font-size: 0.9rem;
      pointer-events: none;
    }

    /* Controls Container */
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 380px;
    }

    .file-input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .file-input-group label {
      font-size: 0.85rem;
      color: #cbd5e1;
      font-weight: 600;
    }

    input[type="file"] {
      background: #1e293b;
      color: #f8fafc;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      font-size: 0.85rem;
      cursor: pointer;
    }

    audio {
      width: 100%;
      margin-top: 4px;
    }

    /* Download Button */
    .download-btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, opacity 0.2s;
    }

    .download-btn:hover {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
    }

    .download-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Visualizer Screen -->
  <div class="visualizer-card">
    <span class="placeholder-text" id="placeholderText">Upload Photo & Audio</span>
    <canvas id="mainCanvas" width="720" height="720"></canvas>
  </div>

  <!-- Upload & Audio Controls -->
  <div class="controls-panel">
    <div class="file-input-group">
      <label for="imageUpload">1. Select Photo</label>
      <input type="file" id="imageUpload" accept="image/*" />
    </div>

    <div class="file-input-group">
      <label for="audioUpload">2. Select Audio File</label>
      <input type="file" id="audioUpload" accept="audio/*" />
    </div>

    <!-- Audio Player -->
    <audio id="audioPlayer" controls></audio>

    <!-- Download Video Button -->
    <button class="download-btn" id="downloadBtn" disabled>
      ⬇️ Export & Download Video
    </button>
  </div>

  <script>
    const imageUpload = document.getElementById('imageUpload');
    const audioUpload = document.getElementById('audioUpload');
    const audio = document.getElementById('audioPlayer');
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const downloadBtn = document.getElementById('downloadBtn');
    const placeholderText = document.getElementById('placeholderText');

    let bgImage = null;
    let audioCtx, analyser, dataArray, bufferLength, mediaStreamDestination;
    let mediaRecorder, recordedChunks = [];

    // 1. Load Photo
    imageUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const img = new Image();
        img.onload = () => {
          bgImage = img;
          placeholderText.style.display = 'none';
          drawFrame();
        };
        img.src = URL.createObjectURL(file);
      }
    });

    // 2. Load Audio & Auto-Play
    audioUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        audio.src = URL.createObjectURL(file);
        audio.load();
        downloadBtn.disabled = false;
        audio.play().catch(err => console.log('Autoplay check:', err));
      }
    });

    // 3. Audio Context Setup
    audio.addEventListener('play', () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();

        const source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);

        // Destination stream for recording audio with canvas video
        mediaStreamDestination = audioCtx.createMediaStreamDestination();
        source.connect(mediaStreamDestination);

        analyser.fftSize = 128; // Standard bin count
        bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);

        drawFrame();
      }
    });

    // 4. Main Rendering Loop (Centered Multi-Color Waveform)
    function drawFrame() {
      requestAnimationFrame(drawFrame);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Background Photo
      if (bgImage) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);

        // Dark ambient overlay around center to pop visualizer
        const centerGrad = ctx.createRadialGradient(
          canvas.width / 2, canvas.height / 2, 50,
          canvas.width / 2, canvas.height / 2, 360
        );
        centerGrad.addColorStop(0, 'rgba(0, 0, 0, 0.1)');
        centerGrad.addColorStop(1, 'rgba(0, 0, 0, 0.55)');
        ctx.fillStyle = centerGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Draw Centered Multi-Color Waveform
      if (analyser) {
        analyser.getByteFrequencyData(dataArray);

        const barWidth = 6;
        const spacing = 4;
        const totalWidth = bufferLength * (barWidth + spacing);
        const startX = (canvas.width - totalWidth) / 2;
        const centerY = canvas.height / 2;
        const maxHeight = 160; // Max outward reach in each direction

        // Create horizontal multi-color gradient across entire waveform width
        const rainbowGrad = ctx.createLinearGradient(startX, 0, startX + totalWidth, 0);
        rainbowGrad.addColorStop(0.00, '#ff007f'); // Neon Pink
        rainbowGrad.addColorStop(0.25, '#7928ca'); // Electric Purple
        rainbowGrad.addColorStop(0.50, '#00dfd8'); // Vibrant Cyan
        rainbowGrad.addColorStop(0.75, '#4ade80'); // Bright Green
        rainbowGrad.addColorStop(1.00, '#facc15'); // Warm Yellow

        ctx.fillStyle = rainbowGrad;
        ctx.shadowColor = '#00dfd8';
        ctx.shadowBlur = 12;

        for (let i = 0; i < bufferLength; i++) {
          // Half-height for symmetrical top/bottom expansion
          const halfBarHeight = (dataArray[i] / 255) * maxHeight;
          const minHeight = 3; // Keep a subtle line visible even during silence
          const barHeight = Math.max(halfBarHeight, minHeight);

          const barX = startX + i * (barWidth + spacing);
          const barY = centerY - barHeight;

          ctx.beginPath();
          // Draws a rounded bar centered along centerY
          ctx.roundRect(barX, barY, barWidth, barHeight * 2, [4]);
          ctx.fill();
        }

        // Reset shadow blur to avoid performance degradation on canvas clears
        ctx.shadowBlur = 0;
      }
    }

    // 5. Download / Export Video Feature
    downloadBtn.addEventListener('click', () => {
      if (!audio.src) return;

      downloadBtn.innerText = "⏺️ Recording Video...";
      downloadBtn.disabled = true;

      // Reset Audio to start
      audio.currentTime = 0;
      audio.play();

      // Capture Canvas Stream (30 FPS)
      const canvasStream = canvas.captureStream(30);
      
      // Combine Canvas Video Track + Web Audio Track
      const audioTrack = mediaStreamDestination.stream.getAudioTracks()[0];
      if (audioTrack) {
        canvasStream.addTrack(audioTrack);
      }

      recordedChunks = [];
      mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm' });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) {
          recordedChunks.push(e.data);
        }
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        
        // Trigger file download
        const a = document.createElement('a');
        a.href = url;
        a.download = 'waveform-video.webm';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        downloadBtn.innerText = "⬇️ Export & Download Video";
        downloadBtn.disabled = false;
      };

      mediaRecorder.start();

      // Stop recording automatically when audio finishes
      audio.onended = () => {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
        }
      };
    });
  </script>
</body>
</html>
