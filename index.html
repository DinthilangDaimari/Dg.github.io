<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dinthilang AI Service</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen">

  <!-- Header -->
  <header class="bg-gray-800 border-b border-gray-700 p-4 text-center">
    <h1 class="text-2xl font-bold text-indigo-400">Dinthilang AI Service</h1>
    <p class="text-sm text-gray-400">Your Personal Assistant</p>
  </header>

  <!-- Chat Log -->
  <div id="chat-log" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
    <div class="bg-gray-800 p-3 rounded-lg w-fit max-w-[80%]">
      Hello! I am <strong>Dinthilang AI</strong>. How can I assist you today?
    </div>
  </div>

  <!-- Input Area -->
  <footer class="bg-gray-800 p-4 border-t border-gray-700">
    <div class="max-w-3xl mx-auto flex flex-col sm:flex-row gap-2">
      <input 
        type="password" 
        id="api-key" 
        placeholder="Enter your Gemini API Key..." 
        class="bg-gray-700 text-white px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500 sm:w-1/3"
      />
      <div class="flex flex-1 gap-2">
        <input 
          type="text" 
          id="user-input" 
          placeholder="Ask Dinthilang something..." 
          class="flex-1 bg-gray-700 text-white px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500"
          onkeydown="if(event.key === 'Enter') sendMessage()"
        />
        <button 
          onclick="sendMessage()" 
          class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-4 py-2 rounded transition"
        >
          Send
        </button>
      </div>
    </div>
  </footer>

  <script>
    async function sendMessage() {
      const apiKey = document.getElementById('api-key').value.trim();
      const inputField = document.getElementById('user-input');
      const chatLog = document.getElementById('chat-log');
      const userText = inputField.value.trim();

      if (!apiKey) {
        alert('Please enter a valid Gemini API Key first.');
        return;
      }
      if (!userText) return;

      // Append User Message
      const userBubble = document.createElement('div');
      userBubble.className = 'bg-indigo-600 text-white p-3 rounded-lg ml-auto w-fit max-w-[80%]';
      userBubble.textContent = userText;
      chatLog.appendChild(userBubble);

      inputField.value = '';
      chatLog.scrollTop = chatLog.scrollHeight;

      // Loading Placeholder
      const aiBubble = document.createElement('div');
      aiBubble.className = 'bg-gray-800 p-3 rounded-lg w-fit max-w-[80%] text-gray-400';
      aiBubble.textContent = 'Dinthilang is thinking...';
      chatLog.appendChild(aiBubble);
      chatLog.scrollTop = chatLog.scrollHeight;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: userText }]
            }],
            systemInstruction: {
              parts: [{ text: "You are Dinthilang AI, a helpful, intelligent, and precise AI assistant." }]
            }
          })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          aiBubble.className = 'bg-gray-800 p-3 rounded-lg w-fit max-w-[80%] text-gray-100';
          aiBubble.textContent = data.candidates[0].content.parts[0].text;
        } else {
          aiBubble.textContent = 'Error: Received invalid response from API.';
        }
      } catch (err) {
        aiBubble.textContent = 'Failed to connect to the AI service. Check your connection or API key.';
      }

      chatLog.scrollTop = chatLog.scrollHeight;
    }
  </script>
</body>
</html>
