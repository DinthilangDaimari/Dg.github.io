<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J.A.R.V.I.S. Assistant</title>
  <style>
    @keyframes pulseGlow {
      0% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 243, 255, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(0, 243, 255, 0.9); }
      100% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 243, 255, 0.4); }
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #050b14;
      color: #00f3ff;
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .header-status {
      position: absolute;
      top: 20px;
      left: 30px;
      letter-spacing: 2px;
    }

    .header-status h2 {
      margin: 0;
      color: #00f3ff;
      font-size: 1.5rem;
    }

    .header-status small {
      color: #0088aa;
    }

    .status-active {
      color: #00ff88;
    }

    .status-listening {
      color: #ff3366;
    }

    .orb-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 40px 0;
    }

    .outer-ring {
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      border: 2px dashed rgba(0, 243, 255, 0.4);
      animation: spinSlow 12s linear infinite;
      pointer-events: none;
    }

    .jarvis-orb {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 243, 255, 0.8) 0%, rgba(0, 50, 100, 0.2) 70%);
      border: 2px solid #00f3ff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      user-select: none;
    }

    .jarvis-orb.active {
      animation: pulseGlow 1.5s infinite ease-in-out;
    }

    .orb-label {
      font-weight: bold;
      color: #000;
      font-size: 13px;
      text-align: center;
    }

    .hud-box {
      max-width: 650px;
      width: 90%;
      background: rgba(0, 30, 60, 0.4);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    .hud-label {
      color: #0088aa;
      font-size: 12px;
      display: block;
      margin-bottom: 4px;
    }

    .hud-command {
      margin: 0 0 15px 0;
      color: #ffffff;
    }

    .hud-response {
      margin: 0;
      font-size: 18px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Top System Header -->
  <div class="header-status">
    <h2>J.A.R.V.I.S. SYSTEM</h2>
    <small>STATUS: <span id="status-tag" class="status-active">ONLINE</span></small>
  </div>

  <!-- Interactive Glowing Orb Visualizer -->
  <div class="orb-container">
    <div class="outer-ring"></div>
    <div id="jarvis-orb" class="jarvis-orb" onclick="toggleListening()">
      <span id="orb-text" class="orb-label">CLICK TO SPEAK</span>
    </div>
  </div>

  <!-- Command & Response Display HUD -->
  <div class="hud-box">
    <div id="command-container" style="display: none;">
      <span class="hud-label">COMMAND:</span>
      <p id="command-text" class="hud-command">""</p>
    </div>

    <div>
      <span class="hud-label">JARVIS:</span>
      <p id="response-text" class="hud-response">JARVIS initialized. Standing by for command, Sir.</p>
    </div>
  </div>

  <script>
    // ⚠️ REPLACE THIS WITH YOUR LIVE BACKEND URL (Render/Railway/Heroku)
    const BACKEND_API_URL = "https://your-jarvis-backend.onrender.com/api/chat";

    let isListening = false;
    let recognition = null;

    // Initialize Web Speech API
    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        updateUI('LISTENING...', 'LISTENING', true);
      };

      recognition.onresult = async (event) => {
        const text = event.results[0][0].transcript;
        document.getElementById('command-container').style.display = 'block';
        document.getElementById('command-text').innerText = `"${text}"`;

        updateUI('PROCESSING...', 'THINKING', true);
        await sendToBackend(text);
      };

      recognition.onerror = (err) => {
        console.error("Speech Recognition Error:", err);
        isListening = false;
        updateUI('ONLINE', 'CLICK TO SPEAK', false);
      };

      recognition.onend = () => {
        isListening = false;
        if (document.getElementById('status-tag').innerText === 'LISTENING...') {
          updateUI('ONLINE', 'CLICK TO SPEAK', false);
        }
      };
    } else {
      document.getElementById('response-text').innerText = "Speech Recognition is not supported on this browser. Use Google Chrome or Edge.";
    }

    function toggleListening() {
      if (!recognition) return;

      if (isListening) {
        recognition.stop();
      } else {
        window.speechSynthesis.cancel(); // Interrupt speech if currently speaking
        recognition.start();
      }
    }

    async function sendToBackend(userMessage) {
      try {
        const response = await fetch(BACKEND_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: userMessage })
        });

        if (!response.ok) throw new Error("Backend server error");

        const data = await response.json();
        document.getElementById('response-text').innerText = data.response;
        speakText(data.response);
      } catch (err) {
        console.error(err);
        const errorMsg = "I am unable to reach backend services. Please ensure your backend is live, Sir.";
        document.getElementById('response-text').innerText = errorMsg;
        speakText(errorMsg);
      }
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.pitch = 0.95;
        utterance.rate = 1.0;

        const voices = window.speechSynthesis.getVoices();
        const jarvisVoice = voices.find(
          v => v.name.includes("David") || v.name.includes("Male") || v.name.includes("UK English Male")
        );
        if (jarvisVoice) utterance.voice = jarvisVoice;

        utterance.onstart = () => {
          updateUI('RESPONDING...', 'SPEAKING', true);
        };

        utterance.onend = () => {
          updateUI('ONLINE', 'CLICK TO SPEAK', false);
        };

        window.speechSynthesis.speak(utterance);
      }
    }

    function updateUI(statusText, orbText, isActive) {
      const statusTag = document.getElementById('status-tag');
      const orb = document.getElementById('jarvis-orb');
      const orbLabel = document.getElementById('orb-text');

      statusTag.innerText = statusText;
      statusTag.className = statusText === 'LISTENING...' ? 'status-listening' : 'status-active';
      orbLabel.innerText = orbText;

      if (isActive) {
        orb.classList.add('active');
      } else {
        orb.classList.remove('active');
      }
    }

    // Pre-load synthesis voices for browser compatibility
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }
  </script>
</body>
</html>
